services:
  mysql:
    image: mysql:8.4
    container_name: taskboard-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskboard}
      MYSQL_USER: ${MYSQL_USER:-taskboard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskboard_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - taskboard_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  taskboard_mysql_data:
